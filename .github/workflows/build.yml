name: Сборка

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Сборка на JDK 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Форматирование и сборка
        run: ./gradlew build --stacktrace
      - name: Байткод обязан быть восьмым
        run: python3 .github/check-bytecode.py build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

  tests:
    name: Тесты на JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 8, 21, 25 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Тесты
        run: >-
          ./gradlew test -PtestJdk=${{ matrix.java }}
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64
          --stacktrace
