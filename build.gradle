plugins {
	id 'java-library'
	id 'java-gradle-plugin'
	id 'maven-publish'
}

group = 'com.mrleonardos'
version = '1.0.0'

repositories {
	mavenCentral()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
	withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 8
}

tasks.withType(Javadoc).configureEach {
	options.encoding = 'UTF-8'
	options.addStringOption('Xdoclint:none', '-quiet')
}

dependencies {
	// ASM не ниже 9.9: 9.7 не читает классы новее Java 22 и падает IllegalArgumentException на первом
	// же файле, собранном свежим JDK. Мод собирается восьмым байткодом, а вот библиотеки внутри jar
	// бывают какими угодно, и проверять их всё равно нам.
	api 'org.ow2.asm:asm:9.9'
	api 'org.ow2.asm:asm-tree:9.9'

	testImplementation platform('org.junit:junit-bom:5.10.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation gradleTestKit()
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

gradlePlugin {
	plugins {
		codeSides {
			id = 'com.mrleonardos.codesides'
			implementationClass = 'com.mrleonardos.codesides.gradle.CodeSidesPlugin'
			displayName = 'CodeSides'
			description = 'Build-time разделение мода на клиент и сервер: физическое вырезание кода чужой стороны + верификация ссылок.'
		}
	}
}

test {
	useJUnitPlatform()

    // Прогон тестов на другой Java: `./gradlew test -PtestJdk=8`. Байткод у мода всегда восьмой, а вот
    // ведёт себя он на разных версиях по-разному: серверы 1.7.10 живут и на 8, и на 21 под lwjgl3ify.
    if (project.hasProperty('testJdk')) {
        int version = project.property('testJdk') as int
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(version)
        }
        // TestKit поднимает настоящую сборку Gradle, а девятому Gradle нужна Java 17 и новее. На
        // восьмой такой тест проверял бы не плагин, а требования самого Gradle.
        if (version < 17) {
            exclude '**/SplitSidesTaskTest*'
        }
    }
	testLogging {
		events 'passed', 'failed', 'skipped'
	}
}

publishing {
	repositories {
		mavenLocal()
	}
}
